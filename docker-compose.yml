    services:
      web:
        build: .
        container_name: kerkom_web
        ports:
          - "8000:80"
        volumes:
          - ./:/var/www/html:z
        restart: always
    
      db:
        image: mariadb:10.6
        container_name: kerkom_db
        environment:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: inventory_toko
        ports:
          - "3308:3306"
        volumes:
          - db_data:/var/lib/mysql
          - ./database.sql:/docker-entrypoint-initdb.d/init.sql
        restart: always
    
      phpmyadmin:
        image: phpmyadmin:latest
        container_name: kerkom_phpmyadmin
        ports:
          - "8888:80"
        environment:
          PMA_HOST: db
        restart: always
    
    volumes:
      db_data: