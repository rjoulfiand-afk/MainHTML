<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar GitHub</title>
    <style>
        body {
            background-color: #f0f8ff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center; 
            align-items: center;     
            height: 100vh;           
            margin: 0;
        }

        .kartu {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;     /* Bikin sudut kotaknya melengkung */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Kasih efek bayangan tipis */
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            color: #34495e;
            font-size: 18px;
        }
        .footer {
            margin-top: 25px;
            font-size: 14px;
            color: #95a5a6;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="kartu">
        <h1>Belajar GitHub🚀</h1>
        <p>Latihan nge-push ke repository github</p>
        <div class="footer">
            Dibuat oleh Kelompok Ganteng | SMKN 10 Surabaya
        </div>
    </div>

</body>
</html>
